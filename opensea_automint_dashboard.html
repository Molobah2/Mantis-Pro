<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenSea Auto-Mint — Drops</title>
<link rel="icon" type="image/png" href="/static/mantis-favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0e12;
    --surface: rgba(255,255,255,0.058);
    --surface-hi: rgba(255,255,255,0.095);
    --border: rgba(200,208,235,0.11);
    --border-hi: rgba(200,208,235,0.24);
    --t0: #e8eaf2;
    --t1: rgba(232,234,242,0.72);
    --t2: rgba(232,234,242,0.44);
    --t3: rgba(232,234,242,0.22);
    --chrome: rgba(200,210,238,0.9);
    --r: 20px;
    --r-sm: 12px;
    --err: rgba(240,80,80,0.88);
    --accent: rgba(120,210,170,0.9);
    --upcoming: rgba(230,190,90,0.9);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--t0);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* ── HEADER ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 0 24px;
    height: 60px;
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(8,9,14,0.82);
    backdrop-filter: blur(28px) saturate(1.8);
    -webkit-backdrop-filter: blur(28px) saturate(1.8);
    border-bottom: 1px solid rgba(200,208,235,0.1);
  }

  .logo-box {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: var(--surface-hi);
    border: 1px solid var(--border-hi);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--chrome);
    letter-spacing: -0.5px;
    flex-shrink: 0;
  }

  .logo-name {
    font-size: 13.5px;
    font-weight: 500;
    color: var(--t1);
    letter-spacing: -0.2px;
    flex-shrink: 0;
  }

  #refresh-btn {
    margin-left: auto;
    padding: 7px 16px;
    background: var(--surface-hi);
    border: 1px solid var(--border-hi);
    border-radius: 100px;
    color: var(--t1);
    font-size: 12.5px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s;
  }
  #refresh-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(200,208,235,0.28); }
  #refresh-btn:disabled { opacity: 0.5; cursor: default; }

  /* ── MAIN ── */
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .hero-eyebrow {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--t3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .hero-title {
    font-size: clamp(36px, 5vw, 56px);
    font-weight: 200;
    color: var(--t0);
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 6px;
  }

  .hero-subtitle {
    font-size: 14px;
    font-weight: 400;
    color: var(--t2);
    letter-spacing: 0.01em;
    margin-bottom: 28px;
  }

  .connect-section {
    max-width: 340px;
    margin-bottom: 40px;
  }
  .connect-label {
    font-size: 11px;
    font-weight: 500;
    color: var(--t3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  /* ── DROP GRID ── */
  .drop-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .drop-card {
    background: linear-gradient(145deg, rgba(255,255,255,0.078) 0%, rgba(255,255,255,0.028) 55%, rgba(255,255,255,0.055) 100%);
    border: 1px solid rgba(200,208,235,0.12);
    border-radius: var(--r-sm);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.11), 0 4px 20px rgba(0,0,0,0.35);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .drop-card:hover {
    border-color: rgba(200,208,235,0.22);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 8px 34px rgba(0,0,0,0.45);
  }
  .drop-card { cursor: pointer; }

  .drop-image-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: rgba(255,255,255,0.03);
    overflow: hidden;
  }
  .drop-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.3s ease;
  }
  .drop-card:hover .drop-image { transform: scale(1.04); }

  .drop-card-body {
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex: 1;
  }

  .drop-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--t0);
    letter-spacing: -0.2px;
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    align-self: flex-start;
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    background: rgba(255,255,255,0.055);
    border: 1px solid rgba(200,208,235,0.14);
    color: var(--t2);
  }
  .status-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

  .status-badge.minting_now {
    background: rgba(120,210,170,0.1);
    border-color: rgba(120,210,170,0.28);
    color: var(--accent);
  }
  .status-badge.upcoming {
    background: rgba(230,190,90,0.1);
    border-color: rgba(230,190,90,0.28);
    color: var(--upcoming);
  }
  .status-badge.not_minting {
    color: var(--t3);
  }

  .status-detail {
    font-size: 11.5px;
    color: var(--t3);
    font-family: 'JetBrains Mono', monospace;
  }

  .drop-link {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    font-weight: 500;
    color: var(--t1);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s;
  }
  .drop-link:hover { color: var(--t0); }

  /* ── EMPTY / LOADING / ERROR ── */
  .state-msg {
    padding: 60px 20px;
    text-align: center;
    color: var(--t2);
    font-size: 13.5px;
  }

  .hidden { display: none !important; }

  /* ── DETAIL MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(6,7,10,0.72);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-panel {
    position: relative;
    width: 100%;
    max-width: 460px;
    max-height: 85vh;
    overflow-y: auto;
    background: linear-gradient(160deg, rgba(24,26,34,0.98) 0%, rgba(14,15,20,0.98) 100%);
    border: 1px solid rgba(200,208,235,0.16);
    border-radius: var(--r);
    box-shadow: 0 24px 60px rgba(0,0,0,0.55);
  }

  .modal-close {
    position: absolute;
    top: 14px; right: 14px;
    z-index: 1;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(10,11,15,0.6);
    border: 1px solid rgba(200,208,235,0.18);
    color: var(--t1);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.12); }

  .modal-image-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: rgba(255,255,255,0.03);
    overflow: hidden;
  }
  .modal-image { width: 100%; height: 100%; object-fit: cover; display: block; }

  .modal-body { padding: 22px 24px 26px; display: flex; flex-direction: column; gap: 14px; }

  .modal-title { font-size: 20px; font-weight: 500; color: var(--t0); letter-spacing: -0.3px; }

  .modal-description {
    font-size: 13.5px;
    line-height: 1.55;
    color: var(--t1);
    white-space: pre-line;
  }

  .modal-links { display: flex; flex-wrap: wrap; gap: 8px; }

  .modal-link-btn {
    padding: 7px 14px;
    border-radius: 100px;
    background: var(--surface-hi);
    border: 1px solid var(--border-hi);
    color: var(--t1);
    font-size: 12.5px;
    font-weight: 500;
    text-decoration: none;
    transition: background 0.15s, color 0.15s;
  }
  .modal-link-btn:hover { background: rgba(255,255,255,0.12); color: var(--t0); }

  .modal-schedule {
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .schedule-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .schedule-row {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    padding: 10px 12px;
  }
  .schedule-row-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .schedule-name { font-size: 13px; font-weight: 500; color: var(--t0); }
  .schedule-badge {
    font-size: 10.5px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 2px 8px;
    border-radius: 100px;
  }
  .schedule-badge-public { background: rgba(120,200,150,0.16); color: #8fd9ac; }
  .schedule-badge-gated { background: rgba(230,170,90,0.16); color: #e6b464; }
  .schedule-timing, .schedule-detail {
    font-size: 12px;
    color: var(--t2);
    margin-top: 4px;
  }
  .schedule-note {
    font-size: 11px;
    color: var(--t3);
    margin-top: 10px;
    line-height: 1.5;
  }

  .modal-mint-link {
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    color: var(--t0);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .modal-details-state {
    font-size: 12.5px;
    color: var(--t3);
  }

  .grant-section {
    margin-top: 4px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .grant-row {
    display: flex;
    gap: 12px;
  }
  .grant-row label {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    color: var(--t2);
  }
  .grant-row input {
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-sm);
    color: var(--t0);
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  .grant-expiry-label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    color: var(--t2);
  }
  .grant-expiry-label select {
    background: var(--surface);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-sm);
    color: var(--t0);
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
  }
  .grant-section #grant-btn {
    align-self: flex-start;
    cursor: pointer;
  }
  .grant-section #grant-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  @media (max-width: 600px) {
    header { padding: 0 16px; gap: 12px; }
    main { padding: 32px 16px 60px; }
    .drop-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-box">M</div>
  <span class="logo-name">Mantis Pro</span>
  <button id="refresh-btn" class="hidden" type="button">Refresh</button>
</header>

<main>
  <div class="hero-eyebrow">OpenSea Auto-Mint</div>
  <div class="hero-title">Tracked Drops</div>
  <div class="hero-subtitle">Public mint status &middot; opensea.io/drops</div>

  <div class="connect-section">
    <div class="connect-label">Wallet (Ethereum mainnet)</div>
    <div id="eth-connect-root"></div>
  </div>

  <div id="loading-msg" class="state-msg">Loading drops…</div>
  <div id="error-msg" class="state-msg hidden"></div>
  <div id="empty-msg" class="state-msg hidden">No drops found yet.</div>
  <div id="drop-grid" class="drop-grid"></div>
</main>

<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button id="modal-close" class="modal-close" type="button" aria-label="Close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// Defense in depth: even though the server only ever sends opensea.io URLs
// today, don't let an href attribute trust that unconditionally — refuse
// anything that isn't actually an https://opensea.io link (blocks
// javascript: URIs etc. if that server-side guarantee ever changes).
function escUrl(url) {
  if (typeof url === 'string' && /^https:\/\/opensea\.io\//.test(url)) {
    return esc(url);
  }
  return '#';
}

// Same defense-in-depth idea as escUrl, scoped to OpenSea's own image CDN.
// Anything else (already filtered server-side, but don't rely on that
// alone) is treated as "no image" rather than trusted into an <img src>.
function escImgUrl(url) {
  if (typeof url === 'string' && /^https:\/\/i2c\.seadn\.io\//.test(url)) {
    return esc(url);
  }
  return null;
}

function statusLabel(status, detail) {
  if (status === 'minting_now') return 'Minting now';
  if (status === 'upcoming') return 'Starts' + (detail ? ' ' + detail : '');
  return 'Not currently minting';
}

// Detail-panel external links (X, Discord, Instagram, arbitrary project
// websites) have no fixed trusted host the way the OpenSea/CDN links do —
// arbitrary external sites are the whole point. Validate by *scheme* using
// the browser's own URL parser (matches how the browser will actually
// resolve the link when clicked) rather than a regex: reject anything that
// isn't literally http/https, same rule the backend already enforces in
// opensea_automint/collection_details.py's validate_external_link.
function escExternalUrl(url) {
  if (typeof url !== 'string' || url.length > 2000) return null;
  try {
    var parsed = new URL(url);
    if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return null;
    if (!parsed.hostname) return null;
  } catch (e) {
    return null;
  }
  // Render the parser's own normalized form, not the raw input string — keeps
  // the validated and rendered values provably identical rather than relying
  // on the raw string matching what was just validated.
  return esc(parsed.href);
}

var LINK_LABELS = { twitter: 'X (Twitter)', discord: 'Discord', instagram: 'Instagram', website: 'Website' };
var activeModalSlug = null; // which drop's modal is currently open, or null if closed

function renderDrops(drops) {
  var grid = document.getElementById('drop-grid');
  var emptyMsg = document.getElementById('empty-msg');
  grid.innerHTML = '';

  if (!drops || drops.length === 0) {
    emptyMsg.classList.remove('hidden');
    return;
  }
  emptyMsg.classList.add('hidden');

  drops.forEach(function (drop) {
    var status = drop.status || 'not_minting';
    var name = esc(drop.name || drop.collection_slug || 'Unknown');
    var imageUrl = escImgUrl(drop.image_url);
    var imageHtml = imageUrl
      ? '<div class="drop-image-wrap"><img class="drop-image" src="' + imageUrl + '" ' +
        'alt="' + name + '" loading="lazy" ' +
        'onerror="this.closest(\'.drop-image-wrap\').style.display=\'none\'"></div>'
      : '';

    var card = document.createElement('div');
    card.className = 'drop-card';
    card.innerHTML =
      imageHtml +
      '<div class="drop-card-body">' +
        '<div class="drop-name">' + name + '</div>' +
        '<span class="status-badge ' + esc(status) + '"><span class="dot"></span>' +
          esc(statusLabel(status, drop.status_detail)) +
        '</span>' +
        (drop.status_detail && status !== 'upcoming' ? '<div class="status-detail">' + esc(drop.status_detail) + '</div>' : '') +
        '<a class="drop-link" href="' + escUrl(drop.mint_page_url) + '" target="_blank" rel="noopener">View on OpenSea &rarr;</a>' +
      '</div>';

    card.addEventListener('click', function (e) {
      if (e.target.closest('a')) return; // let the mint link navigate normally
      openModal(drop);
    });

    grid.appendChild(card);
  });
}

function renderModalShell(drop) {
  var status = drop.status || 'not_minting';
  var name = esc(drop.name || drop.collection_slug || 'Unknown');
  var imageUrl = escImgUrl(drop.image_url);
  var imageHtml = imageUrl
    ? '<div class="modal-image-wrap"><img class="modal-image" src="' + imageUrl + '" ' +
      'alt="' + name + '" onerror="this.closest(\'.modal-image-wrap\').style.display=\'none\'"></div>'
    : '';

  return (
    imageHtml +
    '<div class="modal-body">' +
      '<div class="modal-title" id="modal-title">' + name + '</div>' +
      '<span class="status-badge ' + esc(status) + '"><span class="dot"></span>' +
        esc(statusLabel(status, drop.status_detail)) +
      '</span>' +
      '<div id="modal-details-slot" class="modal-details-state">Loading details…</div>' +
      '<a class="modal-mint-link" href="' + escUrl(drop.mint_page_url) + '" target="_blank" rel="noopener">View on OpenSea &rarr;</a>' +
    '</div>'
  );
}

// Shows the drop's real mint stages (e.g. allowlist-only stages before the
// public one) — plain public data, no wallet needed. Purely informational:
// tells the user THAT a stage exists and when it runs, not whether their
// own wallet is eligible for it (that requires a real wallet connection and
// isn't determinable client-side today).
function renderMintSchedule(schedule) {
  if (!schedule || schedule.length === 0) return '';

  var rows = schedule.map(function (stage) {
    var isAllowlist = (stage.stage_type || '').toLowerCase() !== 'public';
    var badgeClass = isAllowlist ? 'schedule-badge schedule-badge-gated' : 'schedule-badge schedule-badge-public';
    var timing = stage.starts ? 'Starts: ' + esc(stage.starts) : '';
    if (stage.ends) timing += (timing ? ' — Ends: ' : 'Ends: ') + esc(stage.ends);
    return (
      '<li class="schedule-row">' +
        '<div class="schedule-row-top">' +
          '<span class="schedule-name">' + esc(stage.name) + '</span>' +
          '<span class="' + badgeClass + '">' + esc(stage.stage_type) + '</span>' +
        '</div>' +
        (timing ? '<div class="schedule-timing">' + timing + '</div>' : '') +
        (stage.detail ? '<div class="schedule-detail">' + esc(stage.detail) + '</div>' : '') +
      '</li>'
    );
  }).join('');

  return (
    '<div class="modal-schedule">' +
      '<div class="connect-label">Mint Schedule</div>' +
      '<ol class="schedule-list">' + rows + '</ol>' +
      '<div class="schedule-note">Allowlist-only stages require checking eligibility with a connected wallet directly on OpenSea — not yet available here.</div>' +
    '</div>'
  );
}

function renderModalDetails(details, requestedForSlug, drop) {
  // Guards against a fast close-then-reopen-different-drop: if the fetch that
  // resolves belongs to a slug that's no longer the open modal (either
  // closed, or replaced by a different drop reusing the same element id),
  // discard it rather than rendering the wrong project's links/description
  // under the currently-displayed title.
  if (requestedForSlug !== activeModalSlug) return;

  var slot = document.getElementById('modal-details-slot');
  if (!slot) return; // modal was closed before the fetch resolved

  var hasContent = details && (
    details.description ||
    (details.links && Object.keys(details.links).length > 0) ||
    (details.mint_schedule && details.mint_schedule.length > 0)
  );

  var descriptionHtml = details && details.description
    ? '<div class="modal-description">' + esc(details.description) + '</div>'
    : '';

  var scheduleHtml = details ? renderMintSchedule(details.mint_schedule) : '';

  var linkButtons = '';
  if (details && details.links) {
    Object.keys(details.links).forEach(function (category) {
      var url = escExternalUrl(details.links[category]);
      if (!url) return;
      var label = LINK_LABELS[category] || esc(category);
      linkButtons +=
        '<a class="modal-link-btn" href="' + url + '" target="_blank" rel="noopener noreferrer">' +
          esc(label) +
        '</a>';
    });
  }
  var linksHtml = linkButtons ? '<div class="modal-links">' + linkButtons + '</div>' : '';

  var noContentHtml = hasContent ? '' : '<div class="modal-details-state">No additional details found.</div>';

  currentModalDrop = drop || null;
  currentModalContractAddress = (details && details.contract_address) || null;

  slot.outerHTML =
    descriptionHtml + linksHtml + scheduleHtml + noContentHtml +
    '<div id="grant-section-container">' + renderGrantSection(drop, currentModalContractAddress) + '</div>' +
    '<div id="arm-section-container">' + renderArmSection(currentModalContractAddress) + '</div>';

  if (currentModalContractAddress && document.getElementById('arm-status') && drop && drop.collection_slug) {
    initArmStatus(drop.collection_slug, currentModalContractAddress);
  }

  // Only kick off the on-chain lookup when the grant form actually rendered
  // (wallet connected + contract known) — avoids a pointless RPC call when
  // the section shows a "connect your wallet" notice instead.
  if (currentModalContractAddress && document.getElementById('grant-expiry')) {
    initGrantExpiry(currentModalContractAddress);
  }
}

// ── Grant permission (session key) ──────────────────────────────────────
// Read-only display + the actual signing flow live in eth-connect.tsx via
// window.grantMintPermission — this just builds the form and wires it up.

var GRANT_DEFAULT_VALUE_CAP_ETH = 0.05;
var GRANT_MAX_QUANTITY = 10;
var currentModalDrop = null;
var currentModalContractAddress = null;
// Fallback when the real on-chain mint end time isn't available (e.g. a
// token-gated/allowlist-only stage with no public getPublicDrop data).
var GRANT_DEFAULT_EXPIRES_IN_SECONDS = 86400; // 24 hours

// Fixed-duration choices offered alongside the auto-detected "until mint
// ends" option — seconds chosen so the longest (29 days) stays a 1-day
// safety margin under the backend's exact 30-day ceiling
// (opensea_automint/security.py's _MAX_EXPIRES_AT_SECONDS_FROM_NOW).
var GRANT_EXPIRY_PRESETS = [
  [3600, '1 hour'],
  [21600, '6 hours'],
  [86400, '24 hours'],
  [259200, '3 days'],
  [604800, '7 days'],
  [2505600, '29 days (maximum)'],
];

function formatExpiryDate(seconds) {
  var d = new Date(Date.now() + seconds * 1000);
  return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}

// autoSeconds: the real on-chain-derived suggestion (or null while it's
// still loading / unavailable). When present it's prepended and selected;
// otherwise the 24-hour preset is selected so the form always has a valid
// value even before the on-chain lookup resolves.
function grantExpiryOptionsHtml(autoSeconds) {
  var options = '';
  if (autoSeconds) {
    options += '<option value="' + autoSeconds + '" selected>Until mint ends — ' + esc(formatExpiryDate(autoSeconds)) + '</option>';
  }
  GRANT_EXPIRY_PRESETS.forEach(function (preset) {
    var isDefaultSelected = !autoSeconds && preset[0] === GRANT_DEFAULT_EXPIRES_IN_SECONDS;
    options += '<option value="' + preset[0] + '"' + (isDefaultSelected ? ' selected' : '') + '>' + preset[1] + '</option>';
  });
  return options;
}

// Tracks whether the user has manually touched the expiry <select> since it
// was last (re)rendered — set by the delegated 'change' listener below, and
// reset every time renderGrantSection builds a fresh select. Prevents the
// async on-chain suggestion from clobbering a choice the user already made
// while the getPublicDrop lookup was still in flight.
var grantExpiryUserEdited = false;

document.addEventListener('change', function (e) {
  if (e.target && e.target.id === 'grant-expiry') grantExpiryUserEdited = true;
});

// Fires after the grant form is in the DOM: asks eth-connect.tsx's
// publicClient to read the collection's real on-chain mint end time
// (SeaDrop's getPublicDrop) and, if available, replaces the static preset
// list with that as the selected default. Guards against the modal having
// moved on to a different drop, or the user already having picked a
// duration themselves, by the time the async lookup resolves.
function initGrantExpiry(contractAddress) {
  if (!window.getSuggestedExpirySeconds) return;
  window.getSuggestedExpirySeconds(contractAddress)
    .then(function (seconds) {
      if (!seconds) return;
      if (currentModalContractAddress !== contractAddress) return; // stale — modal moved on
      if (grantExpiryUserEdited) return; // user already made their own choice — don't override it
      var select = document.getElementById('grant-expiry');
      if (select) select.innerHTML = grantExpiryOptionsHtml(seconds);
    })
    .catch(function () {
      // Suggestion unavailable — the static preset options already
      // rendered (24h default selected), nothing more to do.
    });
}

function renderGrantSection(drop, contractAddress) {
  // Both statuses matter here: 'upcoming' is the actual auto-mint use case
  // (grant + arm before it opens, then walk away), 'minting_now' still
  // supports granting late (e.g. right as a drop opens) or for a public
  // stage on a multi-stage drop that's already live.
  if (!drop || (drop.status !== 'minting_now' && drop.status !== 'upcoming')) return '';

  if (!contractAddress) {
    return '<div class="modal-details-state">Mint contract not yet discovered for this collection — permission grant unavailable.</div>';
  }

  if (!window.__ethOwnerAddress) {
    return '<div class="modal-details-state">Connect your wallet above to grant a minting permission for this drop.</div>';
  }

  grantExpiryUserEdited = false; // fresh <select> below — no user choice to protect yet

  return (
    '<div class="grant-section" data-contract="' + esc(contractAddress) + '">' +
      '<div class="connect-label">Grant Minting Permission</div>' +
      '<div class="grant-row">' +
        '<label>Quantity<input type="number" id="grant-quantity" min="1" max="' + GRANT_MAX_QUANTITY + '" value="1"></label>' +
        '<label>Max ETH<input type="number" id="grant-value-cap" min="0" step="0.01" value="' + GRANT_DEFAULT_VALUE_CAP_ETH + '"></label>' +
      '</div>' +
      '<label class="grant-expiry-label">Expires<select id="grant-expiry">' + grantExpiryOptionsHtml(null) + '</select></label>' +
      '<button id="grant-btn" type="button" class="modal-link-btn">Grant Permission</button>' +
      '<div id="grant-status" class="modal-details-state"></div>' +
    '</div>'
  );
}

function refreshGrantSectionIfOpen() {
  var overlay = document.getElementById('modal-overlay');
  if (!overlay || overlay.classList.contains('hidden')) return;
  var container = document.getElementById('grant-section-container');
  if (!container || !currentModalDrop) return;
  // Wallet finished connecting while this modal was already open — swap
  // the "connect your wallet" notice for the real grant form without
  // needing to re-fetch collection details (already cached above).
  container.innerHTML = renderGrantSection(currentModalDrop, currentModalContractAddress);
  if (currentModalContractAddress && document.getElementById('grant-expiry')) {
    initGrantExpiry(currentModalContractAddress);
  }

  var armContainer = document.getElementById('arm-section-container');
  if (armContainer) {
    armContainer.innerHTML = renderArmSection(currentModalContractAddress);
    if (currentModalContractAddress && document.getElementById('arm-status') && currentModalDrop.collection_slug) {
      initArmStatus(currentModalDrop.collection_slug, currentModalContractAddress);
    }
  }
}

document.addEventListener('click', function (e) {
  if (e.target && e.target.id === 'grant-btn') {
    handleGrantClick(e.target);
  }
});

// Converts a decimal ETH string to a wei string WITHOUT going through
// floating-point multiplication (valueEth * 1e18 loses sub-wei precision
// once past Number.MAX_SAFE_INTEGER) — parses the integer/fractional parts
// separately and builds the wei amount as exact digit strings.
function ethStringToWei(ethStr) {
  var s = String(ethStr || '0').trim();
  if (!/^\d*\.?\d*$/.test(s) || s === '' || s === '.') return '0';
  var parts = s.split('.');
  var whole = parts[0] || '0';
  var frac = (parts[1] || '').slice(0, 18); // truncate beyond wei precision
  frac = frac + '0'.repeat(18 - frac.length);
  var weiStr = (whole + frac).replace(/^0+(?=\d)/, '');
  try {
    return BigInt(weiStr).toString();
  } catch (e) {
    return '0';
  }
}

async function handleGrantClick(btn) {
  var section = btn.closest('.grant-section');
  var status = document.getElementById('grant-status');
  var contractAddress = section ? section.getAttribute('data-contract') : null;
  var quantityInput = document.getElementById('grant-quantity');
  var valueCapInput = document.getElementById('grant-value-cap');

  if (!contractAddress || !window.grantMintPermission) {
    if (status) status.textContent = 'Grant unavailable — wallet module not loaded.';
    return;
  }

  var quantity = Math.max(1, Math.min(GRANT_MAX_QUANTITY, parseInt(quantityInput.value, 10) || 1));
  var valueCapWei = ethStringToWei(valueCapInput.value);
  var expirySelect = document.getElementById('grant-expiry');
  var expiresInSeconds = (expirySelect && parseInt(expirySelect.value, 10)) || GRANT_DEFAULT_EXPIRES_IN_SECONDS;

  btn.disabled = true;
  btn.textContent = 'Granting…';
  if (status) status.textContent = '';

  try {
    var result = await window.grantMintPermission({
      nftContractAddress: contractAddress,
      maxQuantity: quantity,
      valueCapWei: valueCapWei,
      expiresInSeconds: expiresInSeconds,
    });
    if (status) status.textContent = 'Permission granted (id ' + result.grantId + '). Nothing has been minted — this only authorizes a future, separate mint action.';
    btn.textContent = 'Granted';
    if (document.getElementById('arm-status') && currentModalDrop && currentModalDrop.collection_slug) {
      initArmStatus(currentModalDrop.collection_slug, contractAddress);
    }
  } catch (err) {
    if (status) status.textContent = 'Grant failed: ' + (err && err.message ? err.message : String(err));
    btn.disabled = false;
    btn.textContent = 'Grant Permission';
  }
}

// ── Arm Auto-Mint ──────────────────────────────────────────────────────
// Fires automatically once the drop's real on-chain public stage opens —
// see opensea_automint/firing.py's watcher. This section only ever creates
// or cancels an arm REQUEST (a row saying "please do this later"); nothing
// here itself spends ETH — that only happens server-side, asynchronously,
// once the drop is actually live.

var ARM_DEFAULT_MAX_PRICE_ETH = 0.05;
var ARM_MAX_QUANTITY = 10;

var ARM_STATUS_LABELS = {
  pending_schedule: 'Armed — waiting to check the drop schedule',
  scheduled: 'Armed — waiting for the drop to open',
  armed: 'Firing now…',
  fired: 'Firing now…',
  succeeded: 'Minted!',
  failed: 'Failed',
  cancelled: 'Cancelled',
  expired: 'Expired — window closed before firing',
};

var ARM_CANCELABLE_STATUSES = ['pending_schedule', 'scheduled', 'armed'];
var ARM_TERMINAL_STATUSES = ['succeeded', 'failed', 'cancelled', 'expired'];

function renderArmSection(contractAddress) {
  if (!contractAddress) return '';
  if (!window.__ethOwnerAddress) return '';

  return (
    '<div class="grant-section" data-contract="' + esc(contractAddress) + '">' +
      '<div class="connect-label">Auto-Mint</div>' +
      '<div id="arm-status" class="modal-details-state">Loading auto-mint status…</div>' +
    '</div>'
  );
}

function renderArmForm() {
  return (
    '<div class="grant-row">' +
      '<label>Quantity<input type="number" id="arm-quantity" min="1" max="' + ARM_MAX_QUANTITY + '" value="1"></label>' +
      '<label>Max ETH (total)<input type="number" id="arm-max-price" min="0" step="0.01" value="' + ARM_DEFAULT_MAX_PRICE_ETH + '"></label>' +
    '</div>' +
    '<button id="arm-btn" type="button" class="modal-link-btn">Arm Auto-Mint</button>' +
    '<div id="arm-form-status" class="modal-details-state"></div>'
  );
}

function renderArmStatusDisplay(arm, attempts) {
  var label = ARM_STATUS_LABELS[arm.status] || arm.status;
  var html = '<div class="schedule-detail">Status: <strong>' + esc(label) + '</strong></div>';

  var lastAttempt = attempts && attempts.length ? attempts[attempts.length - 1] : null;
  if (lastAttempt && lastAttempt.tx_hash) {
    html += '<div class="schedule-detail"><a class="modal-link-btn" href="https://etherscan.io/tx/' +
      encodeURIComponent(lastAttempt.tx_hash) + '" target="_blank" rel="noopener noreferrer">View transaction &rarr;</a></div>';
  } else if (lastAttempt && lastAttempt.error_message) {
    html += '<div class="schedule-detail">' + esc(lastAttempt.error_message) + '</div>';
  }

  if (ARM_CANCELABLE_STATUSES.indexOf(arm.status) !== -1) {
    html += '<button id="arm-cancel-btn" type="button" class="modal-link-btn" data-arm-id="' + arm.id + '">Cancel</button>';
  } else if (ARM_TERMINAL_STATUSES.indexOf(arm.status) !== -1 && arm.status !== 'succeeded') {
    // Failed/cancelled/expired can be armed again — succeeded is left final.
    html += renderArmForm();
  }

  return html;
}

// Guards against a fast close-then-reopen-different-drop the same way
// initGrantExpiry does: only apply the fetched result if #arm-status is
// still actually in the DOM by the time it resolves.
function initArmStatus(collectionSlug, contractAddress) {
  var el = document.getElementById('arm-status');
  if (!el) return;
  fetch('/api/opensea/arm/for-drop?owner=' + encodeURIComponent(window.__ethOwnerAddress) +
        '&collectionSlug=' + encodeURIComponent(collectionSlug))
    .then(function (res) {
      if (!res.ok) throw new Error('API ' + res.status);
      return res.json();
    })
    .then(function (data) {
      var current = document.getElementById('arm-status');
      if (!current) return; // modal closed (or moved to a different drop) while this was in flight
      current.innerHTML = data.arm ? renderArmStatusDisplay(data.arm, data.attempts || []) : renderArmForm();
    })
    .catch(function () {
      var current = document.getElementById('arm-status');
      if (current) current.innerHTML = renderArmForm();
    });
}

document.addEventListener('click', function (e) {
  if (e.target && e.target.id === 'arm-btn') {
    handleArmClick(e.target);
  }
  if (e.target && e.target.id === 'arm-cancel-btn') {
    handleCancelArmClick(e.target);
  }
});

// Must build byte-for-byte the same message text as opensea_automint/
// firing.py's build_arm_message/build_cancel_message — the backend
// verifies the signature against a message it reconstructs independently
// from the request's own fields, so any mismatch (wording, field order,
// even whitespace) makes a legitimate signature fail verification.
// timestamp is always a plain integer (Math.floor(Date.now()/1000)),
// deliberately never a float, so its text representation can never differ
// between JS and Python.
function buildArmMessage(collectionSlug, quantity, maxPriceWei, timestamp) {
  return 'Mantis Pro OpenSea Auto-Mint\n' +
    'action: arm\n' +
    'collectionSlug: ' + collectionSlug + '\n' +
    'quantity: ' + quantity + '\n' +
    'maxPriceWei: ' + maxPriceWei + '\n' +
    'timestamp: ' + timestamp;
}

function buildCancelMessage(armId, timestamp) {
  return 'Mantis Pro OpenSea Auto-Mint\n' +
    'action: cancel\n' +
    'armId: ' + armId + '\n' +
    'timestamp: ' + timestamp;
}

async function handleArmClick(btn) {
  var section = btn.closest('.grant-section');
  var contractAddress = section ? section.getAttribute('data-contract') : null;
  var quantityInput = document.getElementById('arm-quantity');
  var maxPriceInput = document.getElementById('arm-max-price');
  var formStatus = document.getElementById('arm-form-status');

  if (!contractAddress || !currentModalDrop || !currentModalDrop.collection_slug) {
    if (formStatus) formStatus.textContent = 'Arm unavailable — drop details not loaded.';
    return;
  }
  if (!window.signOwnerMessage) {
    if (formStatus) formStatus.textContent = 'Arm unavailable — wallet module not loaded.';
    return;
  }

  var quantity = Math.max(1, Math.min(ARM_MAX_QUANTITY, parseInt(quantityInput.value, 10) || 1));
  var maxPriceWei = ethStringToWei(maxPriceInput.value);
  var timestamp = Math.floor(Date.now() / 1000);

  btn.disabled = true;
  btn.textContent = 'Arming…';
  if (formStatus) formStatus.textContent = '';

  try {
    // Proves the caller actually controls this wallet — without this, the
    // backend would only ever see a bare, self-reported address (public
    // knowledge for any wallet) and anyone could arm on someone else's
    // behalf. See opensea_automint/routes.py's api_arm_drop docstring.
    formStatus && (formStatus.textContent = 'Confirm the signature request in your wallet…');
    var signature = await window.signOwnerMessage(
      buildArmMessage(currentModalDrop.collection_slug, quantity, maxPriceWei, timestamp)
    );
    if (formStatus) formStatus.textContent = '';

    var res = await fetch('/api/opensea/arm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ownerAddress: window.__ethOwnerAddress,
        collectionSlug: currentModalDrop.collection_slug,
        quantity: quantity,
        maxPriceWei: maxPriceWei,
        signature: signature,
        timestamp: timestamp,
      }),
    });
    var body = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(body.error || ('API ' + res.status));

    initArmStatus(currentModalDrop.collection_slug, contractAddress);
  } catch (err) {
    if (formStatus) formStatus.textContent = 'Arm failed: ' + (err && err.message ? err.message : String(err));
    btn.disabled = false;
    btn.textContent = 'Arm Auto-Mint';
  }
}

async function handleCancelArmClick(btn) {
  var armId = btn.getAttribute('data-arm-id');
  if (!armId || !window.__ethOwnerAddress || !window.signOwnerMessage) return;

  var timestamp = Math.floor(Date.now() / 1000);

  btn.disabled = true;
  btn.textContent = 'Cancelling…';

  try {
    var signature = await window.signOwnerMessage(buildCancelMessage(armId, timestamp));

    var res = await fetch('/api/opensea/arm/' + encodeURIComponent(armId) + '/cancel', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ownerAddress: window.__ethOwnerAddress,
        signature: signature,
        timestamp: timestamp,
      }),
    });
    var body = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(body.error || ('API ' + res.status));

    if (currentModalDrop && currentModalContractAddress) {
      initArmStatus(currentModalDrop.collection_slug, currentModalContractAddress);
    }
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Cancel';
  }
}

async function openModal(drop) {
  var overlay = document.getElementById('modal-overlay');
  var content = document.getElementById('modal-content');
  content.innerHTML = renderModalShell(drop);
  overlay.classList.remove('hidden');

  var slug = drop.collection_slug;
  activeModalSlug = slug || null;
  if (!slug) return;

  try {
    var res = await fetch('/api/opensea/collection/' + encodeURIComponent(slug));
    if (!res.ok) throw new Error('API ' + res.status);
    var details = await res.json();
    renderModalDetails(details, slug, drop);
  } catch (err) {
    if (slug !== activeModalSlug) return; // superseded by a different drop while this was in flight
    var slot = document.getElementById('modal-details-slot');
    if (slot) slot.textContent = 'Could not load additional details.';
  }
}

function closeModal() {
  var overlay = document.getElementById('modal-overlay');
  overlay.classList.add('hidden');
  document.getElementById('modal-content').innerHTML = '';
  activeModalSlug = null;
  currentModalDrop = null;
  currentModalContractAddress = null;
}

async function loadDrops() {
  var loadingMsg = document.getElementById('loading-msg');
  var errorMsg = document.getElementById('error-msg');
  loadingMsg.classList.remove('hidden');
  errorMsg.classList.add('hidden');
  try {
    var res = await fetch('/api/opensea/drops');
    if (!res.ok) throw new Error('API ' + res.status);
    var data = await res.json();
    loadingMsg.classList.add('hidden');
    renderDrops(data.drops || []);
  } catch (err) {
    loadingMsg.classList.add('hidden');
    errorMsg.textContent = 'Could not load drops: ' + err.message;
    errorMsg.classList.remove('hidden');
  }
}

async function refreshDrops() {
  var btn = document.getElementById('refresh-btn');
  var adminKey = window.__ADMIN_KEY__ || '';
  btn.disabled = true;
  btn.textContent = 'Refreshing…';
  try {
    var res = await fetch('/api/opensea/drops/refresh', {
      method: 'POST',
      headers: { 'X-Admin-Key': adminKey }
    });
    if (!res.ok) throw new Error('API ' + res.status);
    var data = await res.json();
    renderDrops(data.drops || []);
  } catch (err) {
    var errorMsg = document.getElementById('error-msg');
    errorMsg.textContent = 'Refresh failed: ' + err.message;
    errorMsg.classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Refresh';
  }
}

document.addEventListener('DOMContentLoaded', function () {
  if (window.__IS_ADMIN__) {
    var btn = document.getElementById('refresh-btn');
    btn.classList.remove('hidden');
    btn.addEventListener('click', refreshDrops);
  }

  var overlay = document.getElementById('modal-overlay');
  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeModal(); // click on backdrop, not the panel itself
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlay.classList.contains('hidden')) closeModal();
  });

  loadDrops();
});

window._onEthConnected = function (ownerAddress, smartAccountAddress) {
  console.log('[eth-connect] connected', ownerAddress, '-> smart account', smartAccountAddress);
  window.__ethOwnerAddress = ownerAddress;
  window.__ethSmartAccountAddress = smartAccountAddress;
  // Re-render the grant section if a modal happens to be open when the
  // wallet finishes connecting (connection can complete after the modal
  // was already opened).
  if (typeof refreshGrantSectionIfOpen === 'function') refreshGrantSectionIfOpen();
};
window._onEthConnectProgress = function (text) {
  console.log('[eth-connect]', text);
  var status = document.getElementById('grant-status');
  if (status) status.textContent = text;
};
window._onEthConnectError = function (msg) {
  console.error('[eth-connect]', msg);
  var status = document.getElementById('grant-status');
  if (status) status.textContent = 'Error: ' + msg;
};
</script>
<script src="/opensea-automint/eth-connect.bundle.js"></script>
</body>
