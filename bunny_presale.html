<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presale Tracker — Bunny Button Toolkit</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1a8a3c;
    --green-light: #2ecc71;
    --green-bright: #00ff6a;
    --dark: #0a1a10;
    --carrot: #ff7a18;
    --carrot-light: #ff9d4d;
    --white: #ffffff;
    --muted: rgba(255,255,255,0.55);
    --card-bg: rgba(255,255,255,0.04);
    --card-border: rgba(255,255,255,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    background: var(--dark);
    color: var(--white);
    overflow-x: hidden;
    background-image:
      radial-gradient(900px circle at 80% -10%, rgba(255,122,24,0.10), transparent 55%),
      radial-gradient(900px circle at 0% 0%, rgba(46,204,113,0.10), transparent 50%);
  }
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.07);
    font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 1px;
  }
  .nav-left { color: var(--muted); }
  .nav-left b { color: var(--white); }
  .nav-left .crumb { color: var(--carrot-light); }
  .nav a { color: var(--green-light); text-decoration: none; transition: color 0.2s; }
  .nav a:hover { color: var(--green-bright); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 24px 80px; }
  .head { text-align: center; margin-bottom: 28px; }
  .head .icon { font-size: 40px; margin-bottom: 12px; }
  .head h1 { font-size: clamp(32px, 5vw, 48px); font-weight: 700; letter-spacing: -1px; margin-bottom: 10px; }
  .head p { color: rgba(255,255,255,0.65); font-weight: 300; font-size: 15px; }

  .status-badge {
    display: inline-block; margin: 0 auto 8px; font-family: 'Space Mono', monospace;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    padding: 6px 16px; border-radius: 20px;
    background: rgba(46,204,113,0.12); color: var(--green-light);
    border: 1px solid rgba(46,204,113,0.3);
  }
  .status-badge.ended { background: rgba(255,122,24,0.12); color: var(--carrot-light); border-color: rgba(255,122,24,0.3); }

  .countdown { text-align: center; margin-bottom: 28px; }
  .countdown .label {
    font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted); margin-bottom: 10px;
  }
  .clock { display: flex; gap: 10px; justify-content: center; }
  .clock .unit {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 10px; padding: 12px 8px; min-width: 70px;
  }
  .clock .num { font-family: 'Space Mono', monospace; font-size: 28px; font-weight: 700; color: var(--carrot); }
  .clock .cap { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }

  .progress-card {
    background: var(--card-bg); border: 1px solid var(--card-border);
    border-radius: 14px; padding: 26px; margin-bottom: 20px;
  }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; flex-wrap: wrap; gap: 6px; }
  .progress-top .raised { font-size: 26px; font-weight: 700; }
  .progress-top .raised b { color: var(--carrot); }
  .progress-top .pct { font-family: 'Space Mono', monospace; color: var(--green-light); font-size: 18px; font-weight: 700; }
  .bar { height: 14px; background: rgba(255,255,255,0.07); border-radius: 8px; overflow: hidden; }
  .bar .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--carrot), var(--carrot-light));
    border-radius: 8px; transition: width 0.8s ease;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 18px 20px; }
  .stat .k { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .stat .v { font-size: 22px; font-weight: 700; font-family: 'Space Mono', monospace; }
  .stat .v.green { color: var(--green-light); }
  .stat .v.carrot { color: var(--carrot-light); }

  .controls { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .btn {
    background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.3);
    color: var(--green-light); border-radius: 10px; padding: 11px 18px;
    font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s;
  }
  .btn:hover { background: rgba(46,204,113,0.2); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .meta { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; color: var(--muted); }

  details { margin-top: 24px; border: 1px solid var(--card-border); border-radius: 10px; background: rgba(0,0,0,0.2); }
  summary { cursor: pointer; padding: 12px 16px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; color: var(--muted); }
  details pre { padding: 0 16px 16px; font-size: 11px; color: rgba(255,255,255,0.6); overflow-x: auto; line-height: 1.5; }

  .state { text-align: center; padding: 50px 20px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 13px; }
  .state.err { color: var(--carrot-light); }
  .spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--carrot); border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { border-top: 1px solid rgba(255,255,255,0.07); padding: 24px; text-align: center; font-family: 'Space Mono', monospace; font-size: 11px; line-height: 1.9; letter-spacing: 1px; color: rgba(255,255,255,0.3); }
  footer a { color: var(--green-light); text-decoration: none; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-left"><b>MANTIS PRO</b> <span class="crumb">/ Bunny Button / Presale</span></div>
  <a href="/bunny">← Tools</a>
</div>

<div class="wrap">
  <div class="head">
    <div class="icon">🎟️</div>
    <h1>Presale Tracker</h1>
    <p>Live ETH raised, CARROT sold, and the countdown to close.</p>
  </div>
  <div id="content">
    <div class="state"><div class="spinner"></div>Loading presale data…</div>
  </div>
</div>

<footer>
  Unofficial community tool · not affiliated with Bunny Button<br>
  Built by <a href="https://x.com/newguy_gn" target="_blank">@newguy_gn</a> · Mantis Pro
</footer>

<script>
  const PROXY = "/api/bunny-proxy?endpoint=";
  const content = document.getElementById("content");
  let countdownTimer = null;

  function pick(obj, keys, def) {
    if (!obj) return def;
    for (const k of keys) {
      if (obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
    }
    return def;
  }
  function num(x) { const n = Number(x); return isNaN(n) ? null : n; }
  function fmt(n, d) {
    if (n === null || n === undefined) return "—";
    return Number(n).toLocaleString("en-US", { maximumFractionDigits: d ?? 0 });
  }
  function toMs(t) {
    if (t === null || t === undefined) return null;
    if (typeof t === "number") return t < 1e12 ? t * 1000 : t;
    const p = Date.parse(t);
    return isNaN(p) ? null : p;
  }

  async function fetchEndpoint(ep) {
    const res = await fetch(PROXY + encodeURIComponent(ep));
    if (res.status === 429) throw new Error("Rate limited — wait a moment and refresh.");
    if (!res.ok) throw new Error("Status " + res.status);
    return res.json();
  }

  async function load() {
    if (countdownTimer) clearInterval(countdownTimer);
    content.innerHTML = '<div class="state"><div class="spinner"></div>Loading presale data…</div>';
    const [presaleR, ethR] = await Promise.allSettled([
      fetchEndpoint("/presale/status"),
      fetchEndpoint("/eth-price")
    ]);

    if (presaleR.status !== "fulfilled") {
      content.innerHTML = '<div class="state err">⚠ Could not load presale: ' + presaleR.reason.message + '</div>';
      return;
    }
    const p = presaleR.value || {};
    const ethData = ethR.status === "fulfilled" ? ethR.value : null;
    const ethPrice = num(pick(ethData, ["price", "ethUsd", "usd", "ethPrice", "priceUsd"], null));

    const raised = num(pick(p, ["raised", "totalRaised", "ethRaised", "raisedEth", "amountRaised", "totalEth"], null));
    const cap = num(pick(p, ["hardCap", "cap", "hardcap", "maxCap", "target", "goal"], 100));
    const sold = num(pick(p, ["tokensSold", "carrotSold", "carrotsSold", "sold", "totalSold"], null));
    let rate = num(pick(p, ["rate", "carrotPerEth", "tokensPerEth", "ratePerEth"], null));
    if (rate === null && sold !== null && raised) rate = sold / raised;
    const participants = num(pick(p, ["participants", "contributors", "buyers", "participantCount", "totalParticipants"], null));
    const statusRaw = String(pick(p, ["status", "state", "phase"], "active")).toLowerCase();
    const endMs = toMs(pick(p, ["endsAt", "endTime", "endDate", "ends", "closesAt", "endTimestamp", "saleEnd"], null));

    const pct = (raised !== null && cap) ? Math.min(100, (raised / cap) * 100) : null;
    const usdRaised = (raised !== null && ethPrice) ? raised * ethPrice : null;
    const ended = statusRaw.includes("end") || statusRaw.includes("clos") || statusRaw.includes("sold") || (endMs && endMs < Date.now());

    let html = '';
    html += '<div style="text-align:center;"><span class="status-badge ' + (ended ? "ended" : "") + '">' +
            (ended ? "● Presale closed" : "● Presale live") + '</span></div>';

    if (!ended && endMs) {
      html += '<div class="countdown"><div class="label">Closes in</div>' +
              '<div class="clock" id="clock">' +
              '<div class="unit"><div class="num" id="cd-d">--</div><div class="cap">Days</div></div>' +
              '<div class="unit"><div class="num" id="cd-h">--</div><div class="cap">Hours</div></div>' +
              '<div class="unit"><div class="num" id="cd-m">--</div><div class="cap">Mins</div></div>' +
              '<div class="unit"><div class="num" id="cd-s">--</div><div class="cap">Secs</div></div>' +
              '</div></div>';
    }

    html += '<div class="progress-card">' +
            '<div class="progress-top">' +
            '<div class="raised"><b>' + fmt(raised, 3) + '</b> / ' + fmt(cap, 0) + ' ETH</div>' +
            (pct !== null ? '<div class="pct">' + pct.toFixed(1) + '%</div>' : '') +
            '</div>' +
            '<div class="bar"><div class="fill" id="fill"></div></div></div>';

    html += '<div class="grid">' +
            '<div class="stat"><div class="k">CARROT Sold</div><div class="v carrot">' + fmt(sold, 0) + '</div></div>' +
            '<div class="stat"><div class="k">Rate (CARROT / ETH)</div><div class="v">' + fmt(rate, 0) + '</div></div>' +
            (participants !== null ? '<div class="stat"><div class="k">Participants</div><div class="v green">' + fmt(participants, 0) + '</div></div>' : '') +
            (usdRaised !== null ? '<div class="stat"><div class="k">Raised (USD)</div><div class="v green">$' + fmt(usdRaised, 0) + '</div></div>' : '') +
            (ethPrice ? '<div class="stat"><div class="k">ETH Price</div><div class="v">$' + fmt(ethPrice, 0) + '</div></div>' : '') +
            '</div>';

    html += '<div class="controls"><span class="meta">Updated ' + new Date().toLocaleTimeString() + '</span>' +
            '<button id="refresh" class="btn">↻ Refresh</button></div>';

    html += '<details><summary>▸ Raw API data (for debugging field names)</summary><pre>' +
            JSON.stringify(p, null, 2).replace(/</g, "&lt;") + '</pre></details>';

    content.innerHTML = html;

    const fill = document.getElementById("fill");
    if (fill && pct !== null) requestAnimationFrame(() => { fill.style.width = pct + "%"; });
    document.getElementById("refresh").addEventListener("click", load);

    if (!ended && endMs) startCountdown(endMs);
  }

  function startCountdown(endMs) {
    function tick() {
      let diff = Math.max(0, endMs - Date.now());
      const d = Math.floor(diff / 86400000); diff -= d * 86400000;
      const h = Math.floor(diff / 3600000); diff -= h * 3600000;
      const m = Math.floor(diff / 60000); diff -= m * 60000;
      const s = Math.floor(diff / 1000);
      const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = String(val).padStart(2, "0"); };
      set("cd-d", d); set("cd-h", h); set("cd-m", m); set("cd-s", s);
      if (endMs - Date.now() <= 0) { clearInterval(countdownTimer); load(); }
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  load();
</script>

</body>
</html>
