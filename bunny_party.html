<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Party Finder — Bunny Button Toolkit</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1a8a3c; --green-light: #2ecc71; --green-bright: #00ff6a;
    --dark: #0a1a10; --carrot: #ff7a18; --carrot-light: #ff9d4d;
    --white: #ffffff; --muted: rgba(255,255,255,0.55);
    --card-bg: rgba(255,255,255,0.04); --card-border: rgba(255,255,255,0.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Space Grotesk', sans-serif; min-height: 100vh;
    background: var(--dark); color: var(--white); overflow-x: hidden;
    background-image:
      radial-gradient(900px circle at 80% -10%, rgba(255,122,24,0.10), transparent 55%),
      radial-gradient(900px circle at 0% 0%, rgba(46,204,113,0.10), transparent 50%);
  }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.07); font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 1px; }
  .nav-left { color: var(--muted); } .nav-left b { color: var(--white); } .nav-left .crumb { color: var(--carrot-light); }
  .nav a { color: var(--green-light); text-decoration: none; transition: color 0.2s; } .nav a:hover { color: var(--green-bright); }

  .wrap { max-width: 880px; margin: 0 auto; padding: 48px 24px 80px; }
  .head { text-align: center; margin-bottom: 28px; }
  .head .icon { font-size: 40px; margin-bottom: 12px; }
  .head h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 700; letter-spacing: -1px; margin-bottom: 10px; }
  .head p { color: rgba(255,255,255,0.65); font-weight: 300; font-size: 15px; }

  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .search { flex: 1; min-width: 180px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 16px; color: var(--white); font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s; }
  .search:focus { border-color: rgba(255,122,24,0.5); } .search::placeholder { color: rgba(255,255,255,0.35); }
  select { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 12px 14px; color: var(--white); font-family: inherit; font-size: 14px; outline: none; cursor: pointer; }
  .btn { background: rgba(46,204,113,0.12); border: 1px solid rgba(46,204,113,0.3); color: var(--green-light); border-radius: 10px; padding: 12px 18px; font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: 1px; cursor: pointer; transition: all 0.2s; }
  .btn:hover { background: rgba(46,204,113,0.2); } .btn:disabled { opacity: 0.5; cursor: default; }
  .meta { font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; color: var(--muted); margin-bottom: 16px; text-align: right; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .party { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; transition: border-color 0.2s, transform 0.2s; }
  .party:hover { border-color: rgba(255,122,24,0.3); transform: translateY(-2px); }
  .party.full { border-color: rgba(255,122,24,0.4); }
  .pname { font-size: 17px; font-weight: 600; margin-bottom: 4px; word-break: break-word; }
  .pleader { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--muted); margin-bottom: 14px; }
  .pcount { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .pcount .n { font-family: 'Space Mono', monospace; font-size: 15px; font-weight: 700; }
  .pcount .pct { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--green-light); }
  .bar { height: 10px; background: rgba(255,255,255,0.07); border-radius: 6px; overflow: hidden; margin-bottom: 14px; }
  .bar .fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--green), var(--green-light)); transition: width 0.5s ease; }
  .bar .fill.full { background: linear-gradient(90deg, var(--carrot), var(--carrot-light)); }
  .pbonus { display: flex; justify-content: space-between; align-items: center; }
  .bonus-chip { font-family: 'Space Mono', monospace; font-size: 12px; padding: 5px 11px; border-radius: 7px; background: rgba(255,122,24,0.12); color: var(--carrot-light); border: 1px solid rgba(255,122,24,0.25); }
  .status-chip { font-family: 'Space Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 4px 9px; border-radius: 6px; }
  .status-chip.open { background: rgba(46,204,113,0.12); color: var(--green-light); }
  .status-chip.full { background: rgba(255,122,24,0.12); color: var(--carrot-light); }

  details { margin-top: 24px; border: 1px solid var(--card-border); border-radius: 10px; background: rgba(0,0,0,0.2); }
  summary { cursor: pointer; padding: 12px 16px; font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 1px; color: var(--muted); }
  details pre { padding: 0 16px 16px; font-size: 11px; color: rgba(255,255,255,0.6); overflow-x: auto; line-height: 1.5; max-height: 360px; }

  .state { text-align: center; padding: 50px 20px; color: var(--muted); font-family: 'Space Mono', monospace; font-size: 13px; }
  .state.err { color: var(--carrot-light); }
  .spinner { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--carrot); border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { border-top: 1px solid rgba(255,255,255,0.07); padding: 24px; text-align: center; font-family: 'Space Mono', monospace; font-size: 11px; line-height: 1.9; letter-spacing: 1px; color: rgba(255,255,255,0.3); }
  footer a { color: var(--green-light); text-decoration: none; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-left"><b>MANTIS PRO</b> <span class="crumb">/ Bunny Button / Party</span></div>
  <a href="/bunny">← Tools</a>
</div>

<div class="wrap">
  <div class="head">
    <div class="icon">👥</div>
    <h1>Party Finder</h1>
    <p>Browse open parties, see how full each is, and the bonus on offer.</p>
  </div>

  <div class="controls">
    <input id="search" class="search" type="text" placeholder="Search party name…" autocomplete="off">
    <select id="sort">
      <option value="fill">Sort: Fullest</option>
      <option value="empty">Sort: Most open</option>
      <option value="bonus">Sort: Best bonus</option>
      <option value="name">Sort: Name</option>
    </select>
    <button id="refresh" class="btn">↻</button>
  </div>
  <div id="meta" class="meta"></div>

  <div id="content"><div class="state"><div class="spinner"></div>Loading parties…</div></div>
</div>

<footer>
  Unofficial community tool · not affiliated with Bunny Button<br>
  Built by <a href="https://x.com/newguy_gn" target="_blank">@newguy_gn</a> · Mantis Pro
</footer>

<script>
  const PROXY = "/api/bunny-proxy?endpoint=";
  const content = document.getElementById("content");
  const meta = document.getElementById("meta");
  const searchEl = document.getElementById("search");
  const sortEl = document.getElementById("sort");
  const refreshBtn = document.getElementById("refresh");

  let parties = [], rawData = null;

  function pick(obj, keys, def) {
    if (!obj) return def;
    for (const k of keys) if (obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
    return def;
  }
  function memberCount(p) {
    const m = pick(p, ["memberCount","members","size","playerCount","count","numMembers"], null);
    if (Array.isArray(m)) return m.length;
    const n = Number(m); return isNaN(n) ? null : n;
  }
  function capacity(p) {
    const c = Number(pick(p, ["maxMembers","capacity","maxSize","max","slots","limit"], NaN));
    return isNaN(c) ? null : c;
  }
  function bonusVal(p) {
    const b = Number(pick(p, ["bonus","bonusPercent","partyBonus","multiplier","boost","bonusMultiplier"], NaN));
    return isNaN(b) ? null : b;
  }
  function leaderOf(p) {
    const l = pick(p, ["leader","owner","captain","host","leaderHandle"], null);
    if (!l) return null;
    if (typeof l === "object") return l.xHandle || l.name || (l.walletAddress ? l.walletAddress.slice(0,6)+"…" : null);
    return l;
  }

  async function load() {
    refreshBtn.disabled = true;
    content.innerHTML = '<div class="state"><div class="spinner"></div>Loading parties…</div>';
    meta.textContent = "";
    try {
      const res = await fetch(PROXY + encodeURIComponent("/party/list"));
      if (res.status === 429) throw new Error("Rate limited — wait a moment and refresh.");
      if (!res.ok) throw new Error("Could not reach party list (status " + res.status + ").");
      rawData = await res.json();
      parties = rawData.parties || rawData.data || (Array.isArray(rawData) ? rawData : []);
      if (!Array.isArray(parties) || parties.length === 0) {
        content.innerHTML = '<div class="state">No active parties right now.</div>' + rawPanel();
        return;
      }
      meta.textContent = parties.length + " parties · updated " + new Date().toLocaleTimeString();
      render();
    } catch (e) {
      content.innerHTML = '<div class="state err">⚠ ' + e.message + '</div>';
    } finally {
      refreshBtn.disabled = false;
    }
  }

  function rawPanel() {
    if (!rawData) return "";
    return '<details><summary>▸ Raw API data (for debugging field names)</summary><pre>' +
      JSON.stringify(rawData, null, 2).replace(/</g, "&lt;") + '</pre></details>';
  }

  function render() {
    const q = searchEl.value.trim().toLowerCase();
    let list = parties.filter(p => {
      if (!q) return true;
      return String(pick(p, ["name","partyName","title","displayName"], "")).toLowerCase().includes(q);
    });

    const fillOf = p => { const m = memberCount(p), c = capacity(p); return (m !== null && c) ? m / c : 0; };
    const s = sortEl.value;
    list = list.slice().sort((a, b) => {
      if (s === "fill") return fillOf(b) - fillOf(a);
      if (s === "empty") return fillOf(a) - fillOf(b);
      if (s === "bonus") return (bonusVal(b) || 0) - (bonusVal(a) || 0);
      return String(pick(a,["name","partyName","title"],"")).localeCompare(String(pick(b,["name","partyName","title"],"")));
    });

    if (list.length === 0) { content.innerHTML = '<div class="state">No parties match "' + searchEl.value + '".</div>' + rawPanel(); return; }

    let html = '<div class="grid">';
    list.forEach(p => {
      const name = pick(p, ["name","partyName","title","displayName"], "Unnamed party");
      const m = memberCount(p), c = capacity(p);
      const pct = (m !== null && c) ? Math.min(100, (m / c) * 100) : null;
      const isFull = (m !== null && c) ? m >= c : false;
      const bonus = bonusVal(p);
      const leader = leaderOf(p);

      html += '<div class="party' + (isFull ? ' full' : '') + '">' +
        '<div class="pname">' + name + '</div>' +
        (leader ? '<div class="pleader">led by ' + leader + '</div>' : '<div class="pleader"></div>') +
        '<div class="pcount"><span class="n">' + (m !== null ? m : "?") + (c ? ' / ' + c : '') + ' members</span>' +
        (pct !== null ? '<span class="pct">' + pct.toFixed(0) + '%</span>' : '') + '</div>' +
        (pct !== null ? '<div class="bar"><div class="fill' + (isFull ? ' full' : '') + '" style="width:' + pct + '%"></div></div>' : '<div style="height:14px"></div>') +
        '<div class="pbonus">' +
        (bonus !== null ? '<span class="bonus-chip">+' + bonus + (bonus < 10 ? '%' : '') + ' bonus</span>' : '<span class="bonus-chip" style="opacity:.5">bonus n/a</span>') +
        '<span class="status-chip ' + (isFull ? 'full' : 'open') + '">' + (isFull ? 'Full' : 'Open') + '</span>' +
        '</div></div>';
    });
    html += '</div>' + rawPanel();
    content.innerHTML = html;
  }

  searchEl.addEventListener("input", () => { if (parties.length) render(); });
  sortEl.addEventListener("change", () => { if (parties.length) render(); });
  refreshBtn.addEventListener("click", load);
  load();
</script>

</body>
</html>
