<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NFT Market Intelligence</title>
<link rel="icon" type="image/png" href="/static/mantis-favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0d0e12;
    --surface: rgba(255,255,255,0.058);
    --surface-hi: rgba(255,255,255,0.095);
    --border: rgba(200,208,235,0.11);
    --border-hi: rgba(200,208,235,0.24);
    --t0: #e8eaf2;
    --t1: rgba(232,234,242,0.72);
    --t2: rgba(232,234,242,0.44);
    --t3: rgba(232,234,242,0.22);
    --chrome: rgba(200,210,238,0.9);
    --r: 20px;
    --r-sm: 12px;
    --err: rgba(240,80,80,0.88);
    --accent: rgba(124,140,255,0.95);
    --gold: rgba(230,190,90,0.9);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--t0);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  header {
    position: sticky; top: 0; z-index: 100;
    padding: 0 24px; height: 60px;
    display: flex; align-items: center; gap: 14px;
    background: rgba(8,9,14,0.82);
    backdrop-filter: blur(28px) saturate(1.8);
    -webkit-backdrop-filter: blur(28px) saturate(1.8);
    border-bottom: 1px solid rgba(200,208,235,0.1);
  }
  .logo-box {
    width: 34px; height: 34px; border-radius: 10px;
    background: var(--surface-hi); border: 1px solid var(--border-hi);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700; color: var(--chrome); letter-spacing: -0.5px;
  }
  .logo-name { font-size: 13.5px; font-weight: 500; color: var(--t1); }

  main { max-width: 900px; margin: 0 auto; padding: 48px 20px 100px; }

  .hero-eyebrow {
    font-size: 11.5px; font-weight: 500; color: var(--t3);
    letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px;
  }
  .hero-title {
    font-size: clamp(30px, 4.5vw, 46px); font-weight: 200; color: var(--t0);
    letter-spacing: -1.5px; line-height: 1.1; margin-bottom: 28px;
  }

  .scan-row { display: flex; gap: 10px; margin-bottom: 8px; }
  #slug-input {
    flex: 1; padding: 14px 18px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 100px;
    color: var(--t0); font-family: 'JetBrains Mono', monospace; font-size: 14px;
    outline: none; transition: border-color 0.18s;
  }
  #slug-input:focus { border-color: var(--border-hi); }
  #slug-input::placeholder { color: var(--t3); }
  #scan-btn {
    padding: 14px 28px; background: var(--accent); border: none; border-radius: 100px;
    color: #0d0e12; font-weight: 600; font-size: 14px; cursor: pointer;
    transition: opacity 0.18s;
  }
  #scan-btn:hover { opacity: 0.88; }
  #scan-btn:disabled { opacity: 0.5; cursor: default; }
  .hint { font-size: 12px; color: var(--t3); margin-bottom: 40px; }
  .hint code { font-family: 'JetBrains Mono', monospace; color: var(--t2); }

  #status { display: none; align-items: center; gap: 10px; color: var(--t2); font-size: 13.5px; margin: 24px 0; }
  #status.visible { display: flex; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid var(--border-hi); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #error { display: none; color: var(--err); font-size: 13.5px; margin: 24px 0; }
  #error.visible { display: block; }

  #results { display: none; }
  #results.visible { display: block; }

  .collection-bar {
    display: flex; align-items: center; gap: 12px; margin: 32px 0 20px;
    padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  .collection-bar img { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; background: var(--surface); }
  .collection-bar .name { font-size: 17px; font-weight: 600; }
  .collection-bar .meta { font-size: 12px; color: var(--t2); font-family: 'JetBrains Mono', monospace; }

  .insight-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 32px; }
  .insight-card {
    padding: 16px 18px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-sm); cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  .insight-card:hover { border-color: var(--border-hi); background: var(--surface-hi); }
  .insight-card.selected { border-color: var(--accent); background: rgba(124,140,255,0.08); }
  .insight-card .badge {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.06em;
    color: var(--gold); text-transform: uppercase; margin-bottom: 6px;
  }
  .insight-card .headline { font-size: 15px; font-weight: 600; color: var(--t0); }
  .insight-card .sub { font-size: 12.5px; color: var(--t2); font-family: 'JetBrains Mono', monospace; margin-top: 4px; }

  #preview-section { display: none; }
  #preview-section.visible { display: block; }

  .format-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .format-btn {
    padding: 8px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 100px; color: var(--t2); font-size: 12.5px; font-weight: 500; cursor: pointer;
  }
  .format-btn.active { border-color: var(--accent); color: var(--t0); background: rgba(124,140,255,0.1); }

  .card-preview-wrap { border-radius: var(--r); overflow: hidden; border: 1px solid var(--border); background: #000; margin-bottom: 18px; }
  .card-preview-wrap img { display: block; width: 100%; height: auto; }
  .card-preview-wrap .loading { padding: 80px 0; text-align: center; color: var(--t3); font-size: 13px; }

  .action-row { display: flex; gap: 10px; margin-bottom: 28px; flex-wrap: wrap; }
  .btn {
    padding: 11px 22px; border-radius: 100px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border-hi); background: var(--surface-hi); color: var(--t0);
  }
  .btn.primary { background: var(--accent); color: #0d0e12; border: none; }
  .btn:hover { opacity: 0.9; }

  .caption-list { display: flex; flex-direction: column; gap: 10px; }
  .caption-card {
    padding: 14px 16px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-sm); font-size: 13.5px; color: var(--t1); line-height: 1.5;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  }
  .caption-card button {
    flex-shrink: 0; padding: 6px 14px; border-radius: 100px; border: 1px solid var(--border-hi);
    background: transparent; color: var(--t1); font-size: 11.5px; cursor: pointer;
  }
  .caption-card button.copied { border-color: var(--accent); color: var(--accent); }

  section-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--t3); margin: 28px 0 12px; }
</style>
</head>
<body>

<header>
  <div class="logo-box">M</div>
  <div class="logo-name">NFT Market Intelligence</div>
</header>

<main>
  <div class="hero-eyebrow">Scan → Insight → X post</div>
  <div class="hero-title">Find something worth posting.</div>

  <div class="scan-row">
    <input id="slug-input" type="text" placeholder="collection-slug (e.g. boredapeyachtclub)" autocomplete="off" />
    <button id="scan-btn">Scan</button>
  </div>
  <div class="hint">Enter an OpenSea collection <code>slug</code> — the part of the URL after <code>opensea.io/collection/</code>.</div>

  <div id="status"><div class="spinner"></div><span id="status-text">Scanning collection…</span></div>
  <div id="error"></div>

  <div id="results">
    <div class="collection-bar" id="collection-bar"></div>
    <section-label>Insights found</section-label>
    <div class="insight-list" id="insight-list"></div>

    <div id="preview-section">
      <section-label>Card preview</section-label>
      <div class="format-row" id="format-row">
        <button class="format-btn active" data-format="16:9">16:9</button>
        <button class="format-btn" data-format="4:5">4:5</button>
        <button class="format-btn" data-format="1:1">1:1</button>
      </div>
      <div class="card-preview-wrap"><div class="loading" id="preview-loading">Rendering…</div><img id="preview-img" style="display:none" /></div>
      <div class="action-row">
        <a class="btn primary" id="download-btn" download>Download PNG</a>
      </div>

      <section-label>Captions</section-label>
      <div class="caption-list" id="caption-list"></div>
    </div>
  </div>
</main>

<script>
(function () {
  let currentSlug = null;
  let currentInsights = [];
  let selectedInsightId = null;
  let selectedFormat = '16:9';

  const $ = (id) => document.getElementById(id);
  const slugInput = $('slug-input');
  const scanBtn = $('scan-btn');
  const statusEl = $('status');
  const statusText = $('status-text');
  const errorEl = $('error');
  const resultsEl = $('results');
  const collectionBar = $('collection-bar');
  const insightList = $('insight-list');
  const previewSection = $('preview-section');
  const previewImg = $('preview-img');
  const previewLoading = $('preview-loading');
  const downloadBtn = $('download-btn');
  const captionList = $('caption-list');
  const formatRow = $('format-row');

  function slugify(raw) {
    raw = raw.trim();
    const match = raw.match(/opensea\.io\/collection\/([a-z0-9-]+)/i);
    if (match) return match[1].toLowerCase();
    return raw.toLowerCase();
  }

  function fmtInsightSub(insight) {
    const d = insight.data;
    switch (insight.type) {
      case 'market_snapshot':
        return d.listed_pct !== undefined ? `${d.listed} listed · ${d.listed_pct}%` : `${d.listed} listed`;
      case 'listing_scarcity':
        return `${d.listed} / ${d.supply} listed (${d.listed_pct}%)`;
      case 'rarest_listed_nft':
        return `rank ${d.rank} / ${d.total} · ${d.price} ${d.currency}`;
      case 'rarest_listed_trait':
        return `${d.count} / ${d.total} have this trait · ${d.listed_count} listed`;
      case 'cheap_listings':
        return `${d.matched_count} listed under ${d.threshold_price} ${d.currency}`;
      default:
        return '';
    }
  }

  async function runScan() {
    const slug = slugify(slugInput.value);
    if (!slug) return;
    currentSlug = slug;

    errorEl.classList.remove('visible');
    resultsEl.classList.remove('visible');
    previewSection.classList.remove('visible');
    statusEl.classList.add('visible');
    statusText.textContent = 'Scanning collection…';
    scanBtn.disabled = true;

    try {
      const resp = await fetch(`/api/insights/scan?slug=${encodeURIComponent(slug)}`);
      const body = await resp.json();
      if (!resp.ok) throw new Error(body.error || `HTTP ${resp.status}`);

      currentInsights = body.insights || [];
      renderCollectionBar(body.collection, body.stats);
      renderInsightList(currentInsights);
      resultsEl.classList.add('visible');

      if (currentInsights.length) {
        selectInsight(currentInsights[0].id);
      }
    } catch (err) {
      errorEl.textContent = `Couldn't scan "${slug}": ${err.message}`;
      errorEl.classList.add('visible');
    } finally {
      statusEl.classList.remove('visible');
      scanBtn.disabled = false;
    }
  }

  // collection.name, insight.headline, and trait/value strings all
  // ultimately come from OpenSea (collection names, NFT trait values) —
  // anyone can set those, so they're untrusted. Built with textContent /
  // createElement below rather than innerHTML so nothing in them can ever
  // be interpreted as markup.
  function renderCollectionBar(collection, stats) {
    collectionBar.innerHTML = '';

    let imgEl;
    if (collection.image_url) {
      imgEl = document.createElement('img');
      imgEl.src = collection.image_url;
      imgEl.alt = '';
    } else {
      imgEl = document.createElement('div');
      imgEl.style.cssText = 'width:40px;height:40px;border-radius:10px;background:var(--surface)';
    }

    const info = document.createElement('div');
    const nameEl = document.createElement('div');
    nameEl.className = 'name';
    nameEl.textContent = collection.name;

    let metaText = collection.slug;
    if (collection.total_supply) metaText += ` · ${collection.total_supply} supply`;
    if (stats && stats.floor_price !== undefined) {
      metaText += ` · floor ${stats.floor_price} ${stats.floor_price_symbol || 'ETH'}`;
    }
    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.textContent = metaText;

    info.appendChild(nameEl);
    info.appendChild(metaEl);
    collectionBar.appendChild(imgEl);
    collectionBar.appendChild(info);
  }

  function renderInsightList(insights) {
    insightList.innerHTML = '';
    insights.forEach((insight) => {
      const card = document.createElement('div');
      card.className = 'insight-card';
      card.dataset.id = insight.id;

      if (insight.is_best) {
        const badge = document.createElement('div');
        badge.className = 'badge';
        badge.textContent = 'Best story';
        card.appendChild(badge);
      }
      const headlineEl = document.createElement('div');
      headlineEl.className = 'headline';
      headlineEl.textContent = insight.headline;
      const subEl = document.createElement('div');
      subEl.className = 'sub';
      subEl.textContent = fmtInsightSub(insight);
      card.appendChild(headlineEl);
      card.appendChild(subEl);

      card.addEventListener('click', () => selectInsight(insight.id));
      insightList.appendChild(card);
    });
  }

  function selectInsight(insightId) {
    selectedInsightId = insightId;
    document.querySelectorAll('.insight-card').forEach((el) => {
      el.classList.toggle('selected', el.dataset.id === insightId);
    });
    previewSection.classList.add('visible');
    loadPreview();
    loadCaptions();
  }

  function loadPreview() {
    if (!currentSlug || !selectedInsightId) return;
    previewImg.style.display = 'none';
    previewLoading.style.display = 'block';
    previewLoading.textContent = 'Rendering…';
    const url = `/api/insights/card?slug=${encodeURIComponent(currentSlug)}&insight_id=${encodeURIComponent(selectedInsightId)}&format=${encodeURIComponent(selectedFormat)}`;
    previewImg.onload = () => { previewLoading.style.display = 'none'; previewImg.style.display = 'block'; };
    previewImg.onerror = () => { previewLoading.textContent = 'Card failed to render.'; };
    previewImg.src = url;
    downloadBtn.href = url;
    downloadBtn.setAttribute('download', `${currentSlug}-${selectedInsightId}-${selectedFormat.replace(':', 'x')}.png`);
  }

  async function loadCaptions() {
    captionList.innerHTML = '';
    if (!currentSlug || !selectedInsightId) return;
    try {
      const resp = await fetch(`/api/insights/caption?slug=${encodeURIComponent(currentSlug)}&insight_id=${encodeURIComponent(selectedInsightId)}`);
      const body = await resp.json();
      if (!resp.ok) return;
      (body.captions || []).forEach((text) => {
        const row = document.createElement('div');
        row.className = 'caption-card';
        const span = document.createElement('span');
        span.textContent = text;
        const btn = document.createElement('button');
        btn.textContent = 'Copy';
        btn.addEventListener('click', () => {
          navigator.clipboard.writeText(text).then(() => {
            btn.textContent = 'Copied';
            btn.classList.add('copied');
            setTimeout(() => { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
          });
        });
        row.appendChild(span);
        row.appendChild(btn);
        captionList.appendChild(row);
      });
    } catch (err) { /* captions are optional; preview still works without them */ }
  }

  formatRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.format-btn');
    if (!btn) return;
    document.querySelectorAll('.format-btn').forEach((el) => el.classList.remove('active'));
    btn.classList.add('active');
    selectedFormat = btn.dataset.format;
    loadPreview();
  });

  scanBtn.addEventListener('click', runScan);
  slugInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') runScan(); });
})();
</script>

</body>
</html>
